services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: mbc-bellenberg-web
    container_name: mbc-bellenberg-web
    restart: unless-stopped
    ports:
      # Host-Port 3000 -> Container-Port 3000 (bei Bedarf anpassen, z. B. "8080:3000")
      - "3000:3000"
    # Umgebungsvariablen aus der .env-Datei laden (siehe .env.example)
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      # Prueft, ob die Startseite erreichbar ist
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
